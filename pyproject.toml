[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chokepoint"
dynamic = ["version"]
description = "Attack-path and patch-priority analyzer: finds the cheapest route to a crown-jewel asset and the smallest set of fixes that cuts off every route"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kunal Singh" }]
keywords = ["security", "attack-graph", "max-flow", "min-cut", "dijkstra", "graph"]

# No runtime dependencies. The algorithms this project exists to demonstrate
# are written by hand against the standard library: heapq and
# collections.deque are the only data structures borrowed. matplotlib arrives
# only with the optional "viz" extra, and networkx only with "dev", where it
# serves as an independent oracle in the test suite.
dependencies = []

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Kunal0626/chokepoint"
Source = "https://github.com/Kunal0626/chokepoint"
Issues = "https://github.com/Kunal0626/chokepoint/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "networkx>=3.0", "matplotlib>=3.7"]

[project.scripts]
chokepoint = "chokepoint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chokepoint.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
